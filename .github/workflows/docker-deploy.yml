name: Docker deploy
on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nmos-scripty-monitoring-dashboard
          tags: |
            # Tag all builds with branch name and sha
            type=sha,prefix=${{ github.ref_name }}-
            # Tag if non-main branch with branch name and latest
            type=raw,value=latest,prefix=${{ github.ref_name }}-,enable=${{ github.ref_name != 'main' }}
            # Tag if main branch with latest (no branch name prefix)
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
